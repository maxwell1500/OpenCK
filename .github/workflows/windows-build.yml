name: Windows Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  QT_VERSION: "6.5.3"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: win64_msvc2019_64

    - name: Configure CMake
      shell: pwsh
      run: |
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
          .. 

    - name: Build
      shell: pwsh
      run: |
        cd build
        cmake --build . --config Release --target openck

    - name: Build tests
      shell: pwsh
      run: |
        cd build
        cmake --build . --config Release --target all_tests

    - name: Run tests
      shell: pwsh
      run: |
        cd build
        ctest -C Release --output-on-failure

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: openck-test-logs
        path: |
          build/bin/Release/*.log
        if-no-files-found: ignore

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: openck-windows
        path: |
          build/bin/Release/openck.exe
          data/editor.ini
        if-no-files-found: error

    - name: Build installer (NSIS)
      shell: pwsh
      run: |
        cd build
        cpack -C Release

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: openck-installer
        path: build/OpenCK-*.exe
        if-no-files-found: error