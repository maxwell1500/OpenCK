name: Windows Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  QT_VERSION: "6.5.3"

jobs:
  build:
    # windows-latest now ships only Visual Studio 18 (2026); the VS17
    # generator can't find an instance there, so pin the VS2022 image.
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: win64_msvc2019_64

    - name: Setup MSBuild (dereference auto-enrolled VS)
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      shell: pwsh
      run: |
        mkdir build
        # vswhere can transiently miss a freshly-provisioned VS instance;
        # retry configure so the runner's registration settles.
        $configured = $false
        for ($i = 1; $i -le 3 -and -not $configured; $i++) {
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -eq 0) { $configured = $true }
          else { Start-Sleep -Seconds 15 }
        }
        if (-not $configured) { exit 1 } 

    - name: Build
      shell: pwsh
      run: |
        cd build
        cmake --build . --config Release --target openck

    - name: Build tests
      shell: pwsh
      run: |
        cd build
        cmake --build . --config Release --target all_tests

    - name: Run tests
      shell: pwsh
      run: |
        cd build
        ctest -C Release --output-on-failure

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: openck-test-logs
        path: |
          build/bin/Release/*.log
          build/test-logs/**/*.log
        if-no-files-found: ignore

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: openck-windows
        path: |
          build/bin/Release/openck.exe
          data/editor.ini
        if-no-files-found: error

    - name: Build installer (NSIS)
      shell: pwsh
      run: |
        cd build
        cpack -C Release

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: openck-installer
        path: build/OpenCK-*.exe
        if-no-files-found: error